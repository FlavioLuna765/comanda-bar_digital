<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - Sistema de Gestão</title>
    <style>
        .rock-gradient {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }
        .card-active {
            border: 2px solid #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
        
    </style>
    
</head>
<body class="rock-gradient min-h-screen flex items-center justify-center font-sans text-gray-100">

    <div class="max-w-md w-full bg-zinc-900 p-8 rounded-xl border border-zinc-800 shadow-2xl">
        <h2 class="text-3xl font-bold text-center mb-8 uppercase tracking-widest text-red-600">Acesso ao Sistema</h2>

        <div class="flex gap-4 mb-8">
            <button onclick="selectProfile('user')" id="btn-user" class="flex-1 p-4 rounded-lg bg-zinc-800 border border-zinc-700 hover:border-red-500 transition-all group">
                <div class="text-sm font-semibold uppercase group-hover:text-red-400">Usuário</div>
            </button>
            <button onclick="selectProfile('adm')" id="btn-adm" class="flex-1 p-4 rounded-lg bg-zinc-800 border border-zinc-700 hover:border-red-500 transition-all group">
                <div class="text-sm font-semibold uppercase group-hover:text-red-400">Administrador</div>
            </button>
        </div>

        <form id="login-form" class="space-y-6">
            <input type="hidden" id="user-role" name="role" value="user">
            
            <div>
                <label class="block text-xs font-bold uppercase mb-2 text-zinc-500">Identificação</label>
                <input type="text" placeholder="E-mail ou Usuário" class="w-full p-3 rounded bg-zinc-800 border border-zinc-700 focus:outline-none focus:border-red-600 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase mb-2 text-zinc-500">Senha</label>
                <input type="password" placeholder="••••••••" class="w-full p-3 rounded bg-zinc-800 border border-zinc-700 focus:outline-none focus:border-red-600 transition-colors">
            </div>

            <button type="submit" class="w-full py-3 bg-red-700 hover:bg-red-600 text-white font-bold rounded shadow-lg shadow-red-900/20 transition-all uppercase tracking-tighter">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script>
        function selectProfile(role) {
            // Atualiza o input escondido
            document.getElementById('user-role').value = role;
            
            // Troca o estilo visual dos botões
            document.getElementById('btn-user').classList.remove('card-active');
            document.getElementById('btn-adm').classList.remove('card-active');
            
            document.getElementById('btn-' + role).classList.add('card-active');
        }
        
        // Inicializa como usuário por padrão
        selectProfile('user');
    </script>
</body>
</html>
