<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Sistema de Gestão - Acesso</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-dark: #1e1e1e;
            --accent-gold: #f39c12;
            --text-gray: #a0a0a0;
            --input-bg: #2a2a2a;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1974&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        .auth-card {
            background: var(--card-dark);
            border: 1px solid var(--accent-gold);
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-width: 450px;
            width: 90%;
            transition: all 0.4s ease;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        .subtitle {
            color: var(--text-gray);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        /* SELEÇÃO DE PERFIL */
        .profile-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .profile-btn {
            flex: 1;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-gray);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .profile-btn.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(243, 156, 18, 0.05);
        }

        /* FORMULÁRIOS */
        .form-group { margin-bottom: 1.2rem; }

        .form-label {
            display: block;
            color: var(--accent-gold);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            margin-left: 5px;
        }

        .form-control {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
            background-color: #252525;
        }

        .btn-main {
            background: var(--accent-gold);
            color: #000;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            border: 2px solid var(--accent-gold);
            transition: 0.3s;
            text-transform: uppercase;
            width: 100%;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn-main:hover {
            background: transparent;
            color: var(--accent-gold);
        }

        .footer-links {
            margin-top: 1.5rem;
            text-align: center;
        }

        .link-item {
            display: block;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 10px;
            transition: 0.3s;
        }

        .link-item:hover { color: var(--accent-gold); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="auth-card" id="auth-card">
        
        <div id="section-login">
            <div class="title">Acesso</div>
            <div class="subtitle">Bem-vindo de volta!</div>

            <div class="profile-selector">
                <button type="button" onclick="setRole('user')" class="profile-btn btn-role active" data-role="user">Usuário</button>
                <button type="button" onclick="setRole('adm')" class="profile-btn btn-role" data-role="adm">Administrador</button>
            </div>

            <form>
                <div class="form-group">
                    <label class="form-label">Identificação</label>
                    <input type="text" placeholder="Usuário ou E-mail" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" placeholder="••••••••" class="form-control">
                </div>
                <button type="submit" class="btn-main">Entrar no Sistema</button>
            </form>

            <div class="footer-links">
                <a href="javascript:void(0)" onclick="showSection('section-forgot')" class="link-item">Esqueci minha senha</a>
                <a href="javascript:void(0)" onclick="showSection('section-register')" class="link-item">Não tem conta? <b>Cadastre-se</b></a>
            </div>
        </div>

        <div id="section-register" class="hidden">
            <div class="title">Cadastro</div>
            <div class="subtitle">Crie seu perfil de acesso</div>

            <form>
                <div class="form-group">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" placeholder="Nome" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" placeholder="seu@email.com" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Nova Senha</label>
                    <input type="password" placeholder="••••••••" class="form-control">
                </div>
                <button type="submit" class="btn-main">Criar Minha Conta</button>
            </form>

            <div class="footer-links">
                <a href="javascript:void(0)" onclick="showSection('section-login')" class="link-item">Voltar para o Login</a>
            </div>
        </div>

        <div id="section-forgot" class="hidden">
            <div class="title">Recuperar</div>
            <div class="subtitle">Enviaremos um link para o seu e-mail</div>

            <form>
                <div class="form-group">
                    <label class="form-label">E-mail de Cadastro</label>
                    <input type="email" placeholder="seu@email.com" class="form-control">
                </div>
                <button type="submit" class="btn-main">Enviar Instruções</button>
            </form>

            <div class="footer-links">
                <a href="javascript:void(0)" onclick="showSection('section-login')" class="link-item">Voltar para o Login</a>
            </div>
        </div>

    </div>

    <script>
        // Troca entre as seções (Login, Cadastro, Esqueci Senha)
        function showSection(sectionId) {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-register').classList.add('hidden');
            document.getElementById('section-forgot').classList.add('hidden');
            
            document.getElementById(sectionId).classList.remove('hidden');
        }

        // Seleção de Perfil (ADM/USER)
        function setRole(role) {
            const buttons = document.querySelectorAll('.btn-role');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('data-role') === role) btn.classList.add('active');
            });
            console.log("Perfil selecionado:", role);
        }
    </script>
</body>
</html>
