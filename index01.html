<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Acesso ao Sistema</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-dark: #1e1e1e;
            --accent-gold: #f39c12;
            --text-gray: #a0a0a0;
            --input-bg: #2a2a2a;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1974&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        .login-card {
            background: var(--card-dark);
            border: 1px solid var(--accent-gold);
            padding: 3rem 2.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-subtitle {
            color: var(--text-gray);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        /* SELEÇÃO DE PERFIL */
        .profile-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 2rem;
        }

        .profile-btn {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-gray);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .profile-btn:hover {
            border-color: var(--accent-gold);
        }

        .profile-btn.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(243, 156, 18, 0.05);
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.2);
        }

        /* ESTILO DOS INPUTS */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: var(--accent-gold);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .form-control {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
        }

        .form-control:focus {
            background-color: #252525;
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.1);
        }

        /* BOTÃO DE LOGIN */
        .btn-login {
            background: var(--accent-gold);
            color: #000;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            border: 2px solid var(--accent-gold);
            transition: all 0.3s ease;
            text-transform: uppercase;
            width: 100%;
            cursor: pointer;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background: transparent;
            color: var(--accent-gold);
            box-shadow: 0 10px 20px rgba(243, 156, 18, 0.2);
        }

        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .forgot-password:hover {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-title">Acesso</div>
        <div class="login-subtitle">Selecione seu perfil e entre</div>

        <div class="profile-selector">
            <button type="button" onclick="selectProfile('user')" id="btn-user" class="profile-btn active">
                Usuário
            </button>
            <button type="button" onclick="selectProfile('adm')" id="btn-adm" class="profile-btn">
                Administrador
            </button>
        </div>

        <form id="login-form">
            <input type="hidden" id="user-role" name="role" value="user">
            
            <div class="form-group">
                <label class="form-label">Identificação</label>
                <input type="text" placeholder="E-mail ou Usuário" class="form-control" required>
            </div>

            <div class="form-group">
                <label class="form-label">Senha de Acesso</label>
                <input type="password" placeholder="••••••••" class="form-control" required>
            </div>

            <button type="submit" class="btn-login">
                Entrar no Sistema
            </button>
        </form>

        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
    </div>

    <script>
        function selectProfile(role) {
            // Atualiza o valor para o backend
            document.getElementById('user-role').value = role;
            
            // Remove classe ativa de todos
            document.querySelectorAll('.profile-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Adiciona classe ativa ao selecionado
            document.getElementById('btn-' + role).classList.add('active');
        }
    </script>
</body>
</html>
