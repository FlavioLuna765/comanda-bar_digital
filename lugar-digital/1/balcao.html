<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Balcão - Lugar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; padding: 20px; }
        .card-mesa { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .status-pagamento { background: #fff3cd !important; border: 2px solid #ffc107 !important; }
        .alerta-fechamento { background: #fff9e6; border: 1px solid #ffeeba; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .contato-pdf { background: #e7f3ff; color: #004085; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.9rem; margin-top: 5px; display: inline-block; }
        .item-linha { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 5px 0; border-bottom: 1px dashed #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="mb-4">Painel de Atendimento - Lugar</h3>
        <div id="lista-balcao" class="row"></div>
    </div>

    <script>
        function renderBalcao() {
            const pedidos = JSON.parse(localStorage.getItem('pedidosBalcao')) || [];
            const container = document.getElementById('lista-balcao');
            const resumo = {};

            pedidos.forEach(p => {
                if(!resumo[p.mesa]) resumo[p.mesa] = { nome: p.nome, itens: [], aguardandoPgto: false, nota: '', contato: '' };
                if(p.status === 'pagamento') {
                    resumo[p.mesa].aguardandoPgto = true;
                    resumo[p.mesa].nota = p.nota;
                    resumo[p.mesa].contato = p.contato;
                }
                if(p.itens) resumo[p.mesa].itens.push(...p.itens);
            });

            container.innerHTML = '';
            for(let n in resumo) {
                const m = resumo[n];
                const total = m.itens.reduce((acc, i) => acc + (i.preco * i.qtd), 0) * 1.10;

                container.innerHTML += `
                    <div class="col-md-4">
                        <div class="card card-mesa ${m.aguardandoPgto ? 'status-pagamento' : ''}">
                            <div class="card-body">
                                <h5>Mesa ${n} - ${m.nome}</h5>
                                
                                ${m.aguardandoPgto ? `
                                    <div class="alerta-fechamento">
                                        <small class="text-danger fw-bold">SOLICITAÇÃO DE PAGAMENTO</small><br>
                                        <span class="small">O cliente deseja fechar a conta, leve a maquina para pagamento.</span><br>
                                        <span class="badge bg-dark mt-2">NOTA: ${m.nota}</span>
                                        ${m.contato ? `<div class="contato-pdf">📄 ENVIAR PDF: ${m.contato}</div>` : ''}
                                    </div>` : ''}
                                
                                <div class="mb-3">
                                    ${m.itens.map(i => `<div class="item-linha"><span>${i.qtd}x ${i.nome}</span><b>R$ ${(i.preco*i.qtd).toFixed(2)}</b></div>`).join('')}
                                </div>

                                <div class="border-top pt-2">
                                    <h4 class="text-success mb-3">Total: R$ ${total.toFixed(2)}</h4>
                                    <button class="btn btn-dark w-100" onclick="finalizarMesa(${n})">PAGO & LIBERAR MESA</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }
        }

        function finalizarMesa(mesa) {
            if(!confirm("Mesa " + mesa + " liberada?")) return;
            let pedidos = JSON.parse(localStorage.getItem('pedidosBalcao')) || [];
            localStorage.setItem('pedidosBalcao', JSON.stringify(pedidos.filter(p => p.mesa != mesa)));
            let status = JSON.parse(localStorage.getItem('statusMesas')) || {};
            delete status[mesa];
            localStorage.setItem('statusMesas', JSON.stringify(status));
            renderBalcao();
        }

        setInterval(renderBalcao, 3000);
        renderBalcao();
    </script>
</body>
</html>
